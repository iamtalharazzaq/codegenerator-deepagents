[project]
name = "codegenerator-deepagents"
version = "0.0.0"
description = "A plan/dispatch/observe/replan orchestrator for Codewright's role roster"
requires-python = ">=3.12,<3.13"
dependencies = [
    "codewright",
    "deepagents>=0.7",
    "click>=8.1",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "pydantic>=2.11",
    "pyyaml>=6",
]

[tool.uv.sources]
codewright = { path = "../codewright", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[dependency-groups]
dev = ["pytest>=8.4", "pytest-asyncio>=1.0", "mypy>=1.18", "ruff>=0.14", "types-pyyaml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = "agent.*"
ignore_missing_imports = true
