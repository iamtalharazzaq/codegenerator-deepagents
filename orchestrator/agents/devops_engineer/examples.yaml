- id: devops-small-dockerfile
  task_types: [write_build_config, verify_build]
  tags: [docker, dockerfile, build, container]
  task: "Add a Dockerfile for the Python script app.py. WRITES: Dockerfile, .dockerignore"
  good: |
    Read app.py and requirements.txt first. Dockerfile: FROM python:3.12-slim (pinned), WORKDIR /app, COPY requirements.txt then pip install, COPY app.py, USER nobody, CMD ["python","app.py"]. Run run_build; status follows its exit code.
  avoid: "A CI pipeline, compose file or cloud setup nobody asked for."
