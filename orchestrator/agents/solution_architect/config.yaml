name: solution-architect
description: Designs the app at a high level (main parts, how they fit, data, interfaces, tech stack).
tools: [ls, read_file, write_file, delete_file]
capabilities: [architecture, high-level design, system design, technical approach, api design]
use_when: Several parts must fit together, or a design needs review. Skip for single-file tools.
task_types: [design_architecture, review_design]
inputs: Requirements file or the request.
deliverables: docs/architecture.md (under 60 lines).
restrictions: 'High level only: no code, schemas, screens, deploy.'
